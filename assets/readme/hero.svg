<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Clinical Record Conformance benchmark</title>
  <desc id="desc">A measured comparison of raw conformance and grounded conformance across prompt-only, strict JSON, and source-aware validator pipelines.</desc>
  <rect width="1200" height="420" rx="18" fill="#f4f1e9"/>
  <path d="M52 44 H1148 M52 376 H1148" stroke="#b8b4aa"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="58" y="80" fill="#7c3028" font-size="17" font-weight="800" letter-spacing="2.5">SYNTHETIC RESEARCH BENCHMARK · 60 RECORDS</text>
    <text x="58" y="146" fill="#161b20" font-size="54" font-weight="760">Clinical Record</text>
    <text x="58" y="201" fill="#161b20" font-size="54" font-weight="760">Conformance</text>
    <text x="58" y="252" fill="#595d5c" font-size="21">When a note passes the rules,</text>
    <text x="58" y="281" fill="#595d5c" font-size="21">is it still grounded in the source?</text>
    <g transform="translate(58 319)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16">
      <text fill="#7c3028">NO PHI</text><text x="79" fill="#8b8b85">/</text>
      <text x="99" fill="#314f59">OFFLINE EVALUATION</text><text x="273" fill="#8b8b85">/</text>
      <text x="293" fill="#314f59">DETERMINISTIC VALIDATOR</text>
    </g>
  </g>
  <g transform="translate(620 58)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text fill="#575b59" font-size="18" font-weight="700">PASS RATE, %</text>
    <g transform="translate(0 36)">
      <path d="M76 0 V280 M76 280 H510" stroke="#979991"/>
      <path d="M76 56 H510 M76 112 H510 M76 168 H510 M76 224 H510" stroke="#d7d3ca"/>
      <g font-size="15" fill="#6c706d" text-anchor="end"><text x="61" y="285">0</text><text x="61" y="229">20</text><text x="61" y="173">40</text><text x="61" y="117">60</text><text x="61" y="61">80</text><text x="61" y="5">100</text></g>
      <rect x="115" y="19" width="42" height="261" fill="#7c3028"/><rect x="162" y="61" width="42" height="219" fill="#314f59"/>
      <rect x="255" y="65" width="42" height="215" fill="#7c3028"/><rect x="302" y="65" width="42" height="215" fill="#314f59"/>
      <rect x="395" y="51" width="42" height="229" fill="#7c3028"/><rect x="442" y="56" width="42" height="224" fill="#314f59"/>
      <g font-size="17" font-weight="750" fill="#272c2e" text-anchor="middle"><text x="160" y="309">A · prose</text><text x="300" y="309">B · JSON</text><text x="440" y="309">C · validator</text></g>
      <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" text-anchor="middle"><text x="136" y="13" fill="#7c3028">93.3</text><text x="183" y="54" fill="#314f59">78.3</text><text x="276" y="58" fill="#7c3028">76.7</text><text x="323" y="58" fill="#314f59">76.7</text><text x="416" y="44" fill="#7c3028">81.7</text><text x="463" y="49" fill="#314f59">80.0</text></g>
    </g>
    <g transform="translate(313 -2)" font-size="14"><rect width="14" height="14" fill="#7c3028"/><text x="22" y="12" fill="#575b59">raw</text><rect x="72" width="14" height="14" fill="#314f59"/><text x="94" y="12" fill="#575b59">grounded + conformant</text></g>
  </g>
</svg>
